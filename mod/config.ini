[menu]
title=永动接线器

[field.enabled]
type=bool
label=伪装 UID
description=开启本地 UID 画面伪装，关闭后恢复原生显示。
default=true

[field.alias_uid]
type=string
label=显示的 UID
description=自定义显示的 UID（1–20 位纯数字）。
min_length=1
max_length=20
format=digits
default=1000000000

[field.mask_name]
type=bool
label=伪装玩家昵称
description=开启本地玩家昵称画面伪装。
default=false

[field.alias_name]
type=string
label=显示的昵称
description=自定义显示的玩家昵称。
min_length=1
max_length=96
format=plain_text
default=管理员

[field.mask_short_id]
type=bool
label=伪装昵称的 # 编号
description=开启本地昵称 # 编号伪装。
default=false

[field.alias_short_id]
type=string
label=显示的 # 编号
description=自定义显示的 # 编号（1–20 位数字）。
min_length=1
max_length=20
format=digits
default=0000
